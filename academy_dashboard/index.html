<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Academy · Operations Dashboard</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--ink:#1c2230;--muted:#667085;--line:#e4e7ec;
  --brand:#2f5bea;--brand-soft:#e8eefc;
  --good:#12805c;--good-soft:#e3f6ee;
  --warn:#b54708;--warn-soft:#fef0e0;
  --bad:#b42318;--bad-soft:#fdecea;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1420;--panel:#171e2e;--ink:#e7ebf3;--muted:#9aa4b8;--line:#273047;
    --brand:#7b9cff;--brand-soft:#1f2a4a;
    --good:#3ccf9a;--good-soft:#12352a;
    --warn:#f5a54a;--warn-soft:#3a2a14;
    --bad:#ff7a70;--bad-soft:#3d1c1a;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1420;--panel:#171e2e;--ink:#e7ebf3;--muted:#9aa4b8;--line:#273047;
  --brand:#7b9cff;--brand-soft:#1f2a4a;
  --good:#3ccf9a;--good-soft:#12352a;
  --warn:#f5a54a;--warn-soft:#3a2a14;
  --bad:#ff7a70;--bad-soft:#3d1c1a;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:16px;padding:6px 10px 14px}
.brand small{display:block;color:var(--muted);font-weight:500;font-size:12px}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:block;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none}
nav a:hover{background:var(--brand-soft)}
nav a.on{background:var(--brand);color:#fff}
nav .no{display:inline-block;width:20px;color:var(--muted);font-size:12px}
nav a.on .no{color:#fff;opacity:.8}
.side-note{margin-top:16px;padding:0 10px}
main{padding:22px 26px;min-width:0}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;margin:0}
h2{font-size:16px;margin:24px 0 10px}
h3{font-size:14px;margin:0 0 8px}
.sub,.note{color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--good)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--brand-soft);color:var(--brand)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;background:var(--brand-soft)}
tr:last-child td{border-bottom:none}
.bars{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:56px;background:var(--brand);border-radius:6px 6px 0 0;min-height:2px}
.bar b{font-size:11px;font-weight:600;margin-bottom:3px;white-space:nowrap}
.bar span{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}
.alert{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;margin-bottom:8px}
.alert.bad{background:var(--bad-soft)} .alert.warn{background:var(--warn-soft)} .alert.info{background:var(--brand-soft)}
.alert span{color:var(--muted);font-size:13px}
.view{display:none}
.view.on{display:block}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
.ctrl label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input[type=number],input[type=text],input[type=search]{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font:inherit;min-width:0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.18);padding:20px 22px;overflow:auto;z-index:10}
.drawer .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.drawer .fields label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.drawer .fields label.chk{flex-direction:row;align-items:center;gap:8px;grid-column:1/-1;color:var(--ink);font-size:13px}
.drawer input[type=number]{width:100%}
.drawer section{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.drawer ul{margin:6px 0 0 18px;padding:0}
.drawer li{margin-bottom:4px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;padding:12px}
  nav{flex-direction:row;overflow-x:auto;gap:6px}
  nav a{white-space:nowrap}
  .side-note{display:none}
  main{padding:16px}
  .drawer .fields{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">A Academy<small>Accounting &amp; operations dashboard</small></div>
    <nav id="nav"></nav>
    <div class="side-note note">Every figure is calculated from the data in <b>Data &amp; settings</b>. Sample data is loaded until you import your own CSV files.</div>
  </aside>
  <main>
    <header class="top">
      <div><h1 id="ptitle">Overview</h1><div class="sub" id="psub"></div></div>
      <div><button class="btn primary" id="openData">Data &amp; settings</button></div>
    </header>
    <div id="views"></div>
  </main>
</div>
<div id="drawerHost"></div>

<script>
/* =====================================================================
   A ACADEMY · OPERATIONS & ACCOUNTING DASHBOARD
   Single-file, no dependencies. Works offline in any modern browser.
   All statements are calculated from transaction tables
   (students, payments, expenses, timesheets, classes).
   ===================================================================== */

// ---------- Assumptions (editable in "Data & settings") -------------------
const CFG = {
  company: 'A Academy',
  feesGST: true,        // confirm with your accountant: some accredited education may be GST-free
  gstRate: 0.10,
  superRate: 0.12,      // super guarantee
  paygRate: 0.15,       // simplified average withholding; replace with ATO withholding tables
  taxRate: 0.25,        // base rate entity company tax rate (confirm)
  openingCash: 30000,
  openingEquip: 40000,
  equipLife: 60,        // months, straight line
  seats: 15,            // seats per class
  classHours: 40,       // paid hours per class per month (teaching + prep)
  teacherRate: 32,      // hourly rate
  monthlyFee: 180,      // default tuition per student per month (ex GST)
  growth: 2.0,          // 2.0 = 200% month-on-month growth in new enrolments (x3 each month)
  classesPerMonth: 4,   // how many new classes you can realistically open per month
  studentsPerAdmin: 250,
  adminSalary: 4200,
  varPerNew: 55,        // marketing + supplies per new student
  cashAlert: 15000
};

const FIELDS = [
  ['feesGST','Tuition fees include GST','bool'],
  ['gstRate','GST rate (%)','pct'],
  ['superRate','Superannuation guarantee (%)','pct'],
  ['paygRate','Average PAYG withholding on wages (%)','pct'],
  ['taxRate','Company income tax rate (%)','pct'],
  ['openingCash','Opening cash (A$)','num'],
  ['openingEquip','Opening equipment cost (A$)','num'],
  ['equipLife','Equipment useful life (months)','num'],
  ['seats','Seats per class','num'],
  ['classHours','Paid hours per class per month (teaching + prep)','num'],
  ['teacherRate','Teacher hourly rate (A$)','num'],
  ['monthlyFee','Default monthly tuition, ex GST (A$)','num'],
  ['growth','Enrolment growth per month (%; 200 = new enrolments triple)','pct'],
  ['classesPerMonth','Maximum new classes you can open per month','num'],
  ['studentsPerAdmin','Students per admin staff member','num'],
  ['adminSalary','Admin salary, gross per month (A$)','num'],
  ['varPerNew','Marketing + supplies per new student (A$)','num'],
  ['cashAlert','Minimum cash alert level (A$)','num']
];

const TEMPLATES = {
  students:   'student_id,name,class_id,start_month,end_month,fee,returning,leave_reason\nAC-00001,Example Student,CL-01,2026-01,,180,N,',
  payments:   'payment_date,student_id,amount_inc_gst\n2026-01-15,AC-00001,198',
  expenses:   'date,type,category,payee,description,amount_ex_gst,gst_claimable,paid_date,receipt_attached\n2026-01-01,opex,Rent,Landlord,January rent,6500,Y,2026-01-01,Y\n2026-01-28,payroll,Admin salaries,Admin Officer,Gross salary,4200,N,,Y\n2026-01-12,capex,Equipment,Tech supplier,Laptops,6000,Y,2026-01-12,Y',
  timesheets: 'month,teacher,class_id,hours,hourly_rate\n2026-01,Teacher 01,CL-01,40,32',
  classes:    'class_id,name,teacher,day,start_time,seats\nCL-01,Mathematics Y1,Teacher 01,Mon,09:00,15'
};

// ---------- Helpers ---------------------------------------------------------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (n < 0 ? '−' : '') + 'A$' + Math.abs(Math.round(n || 0)).toLocaleString('en-AU');
const whole = n => Math.round(n || 0).toLocaleString('en-AU');
const pct = x => (isFinite(x) ? (x * 100).toFixed(1) + '%' : '–');
const r2 = x => Math.round(x * 100) / 100;
const sum = (rows, k) => rows.reduce((a, r) => a + (r[k] || 0), 0);
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ok = s => typeof s === 'string' && /^\d{4}-\d{2}$/.test(s);
const mLabel = ym => ok(ym) ? MN[+ym.slice(5,7) - 1] + ' ' + ym.slice(0,4) : '–';
const fdate = iso => { if (!iso) return '–'; const [y, m, d] = iso.split('-').map(Number); return `${d} ${MN[m-1]} ${y}`; };
const ymIndex = ym => +ym.slice(0,4) * 12 + (+ym.slice(5,7) - 1);
const ymFromIndex = i => Math.floor(i / 12) + '-' + String((i % 12) + 1).padStart(2, '0');
const addMonth = (ym, k) => ymFromIndex(ymIndex(ym) + k);
const monthRange = (a, b) => { const out = []; for (let i = ymIndex(a); i <= ymIndex(b); i++) out.push(ymFromIndex(i)); return out; };
const monthEnd = ym => new Date(Date.UTC(+ym.slice(0,4), +ym.slice(5,7), 0)).toISOString().slice(0,10);
const isActive = (s, m) => ok(s.start) && s.start <= m && (!ok(s.end) || m < s.end);

function normDate(s){
  s = String(s ?? '').trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}
function toYM(s){
  const d = normDate(s); if (d) return d.slice(0,7);
  const m = String(s ?? '').trim().match(/^(\d{4})-(\d{1,2})$/);
  return m ? `${m[1]}-${m[2].padStart(2,'0')}` : '';
}

// Australian BAS quarters: Q1 Jul–Sep, Q2 Oct–Dec, Q3 Jan–Mar, Q4 Apr–Jun.
// BAS for each quarter is due 28 days after the quarter ends.
function qInfo(ym){
  const y = +ym.slice(0,4), mo = +ym.slice(5,7);
  const fy = mo >= 7 ? y + 1 : y;
  const q = mo >= 7 ? (mo <= 9 ? 1 : 2) : (mo <= 3 ? 3 : 4);
  const endMo = [9,12,3,6][q-1];
  const yEnd = q <= 2 ? fy - 1 : fy;
  const due = new Date(Date.UTC(yEnd, endMo, 0) + 28 * 864e5);
  return { key: `FY${fy} Q${q}`, label: `Q${q} FY${String(fy).slice(2)}`, fy, q,
           endYM: `${yEnd}-${String(endMo).padStart(2,'0')}`, dueISO: due.toISOString().slice(0,10) };
}

// ---------- Sample data (6 months, enrolments growing 200% a month) -------
function rng(seed){
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function makeSample(){
  const rnd = rng(20260101);
  const months = monthRange('2026-01', '2026-06'), N = months.length;
  const S = [], P = [], E = [], T = [], C = [];
  const REASONS = ['Relocation','Fees','Timetable clash','Completed program','Other'];
  const SUBJ = ['Mathematics','English','Science','Coding','Music theory'];
  const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat'], TIMES = ['09:00','11:00','13:00','15:30','17:30','18:30'];
  const classCounts = [];
  let seq = 0;
  const round2 = x => Math.round(x * 100) / 100;

  months.forEach((m, i) => {
    const newN = Math.round(3 * Math.pow(1 + CFG.growth, i));
    for (let k = 0; k < newN; k++) {
      seq++;
      let c = classCounts.findIndex(x => x < CFG.seats);
      if (c < 0) { classCounts.push(0); c = classCounts.length - 1; }
      classCounts[c]++;
      let end = null, reason = '';
      for (let j = i + 1; j < N; j++) {
        if (rnd() < 0.03) { end = months[j]; reason = REASONS[Math.floor(rnd() * REASONS.length)]; break; }
      }
      S.push({ id: 'AC-' + String(seq).padStart(5,'0'), name: 'Student ' + String(seq).padStart(4,'0'),
               classId: 'CL-' + String(c + 1).padStart(2,'0'), start: m, end, fee: CFG.monthlyFee,
               returning: rnd() < 0.05, reason });
    }
  });

  classCounts.forEach((_, c) => C.push({ id: 'CL-' + String(c + 1).padStart(2,'0'),
    name: SUBJ[c % SUBJ.length] + ' Y' + (c % 6 + 1), teacher: 'Teacher ' + String(Math.floor(c / 2) + 1).padStart(2,'0'),
    day: DAYS[c % 6], time: TIMES[Math.floor(c / 6) % TIMES.length], seats: CFG.seats }));

  months.forEach(m => {
    const open = new Set(S.filter(s => isActive(s, m)).map(s => s.classId));
    open.forEach(cid => {
      const cl = C.find(x => x.id === cid);
      T.push({ month: m, teacher: cl.teacher, classId: cid, hours: CFG.classHours, rate: CFG.teacherRate });
    });
  });

  const inc = CFG.feesGST ? CFG.monthlyFee * (1 + CFG.gstRate) : CFG.monthlyFee;
  S.forEach(s => {
    for (let i = months.indexOf(s.start); i < N; i++) {
      const m = months[i]; if (s.end && m >= s.end) break;
      const r = rnd();
      if (r < 0.80) P.push({ date: m + '-15', sid: s.id, amt: round2(inc) });
      else if (r < 0.95 && i + 1 < N) P.push({ date: months[i+1] + '-15', sid: s.id, amt: round2(inc) });
    }
  });

  months.forEach((m, i) => {
    const newN = S.filter(s => s.start === m).length;
    const active = S.filter(s => isActive(s, m)).length;
    const d = dd => m + '-' + String(dd).padStart(2,'0');
    const nextM = i < N - 1 ? months[i+1] : null;
    const add = (date, type, cat, payee, desc, amt, gst, paid) =>
      E.push({ date, type, cat, payee, desc, amt: round2(amt), gst, paid: paid || '', receipt: rnd() < 0.93 });
    add(d(1), 'opex', 'Rent', 'Landlord – Suite 4', 'Monthly rent', 6500, true, d(1));
    add(d(3), 'opex', 'Utilities', 'Energy retailer', 'Electricity & internet', 900, true, nextM ? nextM + '-25' : '');
    add(d(2), 'opex', 'Software & LMS', 'Cloud software vendor', 'LMS, video meetings, Workspace', 500 + 2 * active, true, d(5));
    add(d(5), 'opex', 'Marketing', 'Ads platform', 'Paid social & search', 2000 + 30 * newN, true, nextM ? nextM + '-05' : '');
    add(d(6), 'opex', 'Insurance', 'Insurer', 'Public liability & property', 450, true, d(6));
    add(d(8), 'opex', 'Teaching supplies', 'Stationery supplier', 'Workbooks & classroom supplies', 25 * newN, true, nextM ? nextM + '-20' : '');
    add(d(10), 'opex', 'Accounting & legal', 'Accounting firm', 'Bookkeeping & BAS agent', 400, true, d(28));
    add(d(28), 'payroll', 'Admin salaries', 'Admin Officer', 'Gross salary', 4200, false, '');
    add(d(28), 'payroll', 'Admin salaries', 'Operations Coordinator', 'Gross salary', 5000, false, '');
    if (i >= 3) add(d(28), 'payroll', 'Admin salaries', 'Enrolment Officer', 'Gross salary', 4000, false, '');
    if (i === 0) add(d(12), 'capex', 'Equipment', 'Tech supplier', 'Laptops & tablets for teaching', 6000, true, d(12));
    if (i === 3) add(d(14), 'capex', 'Equipment', 'Furniture supplier', 'Classroom furniture', 2500, true, '');
  });
  months.forEach(m => {
    const rec = P.filter(p => p.date.slice(0,7) === m).reduce((a, p) => a + p.amt, 0);
    E.push({ date: m + '-28', type: 'opex', cat: 'Bank & merchant fees', payee: 'Bank', desc: 'Merchant fees (1.6% of receipts)',
             amt: round2(rec * 0.016), gst: false, paid: m + '-28', receipt: true });
  });
  return { students: S, payments: P, expenses: E, timesheets: T, classes: C };
}

// Normalise any loaded data (sample or CSV) into the same shape
function finalise(D){
  D.students.forEach(s => { s.start = toYM(s.start); s.end = toYM(s.end) || null; s.fee = +s.fee || CFG.monthlyFee; });
  D.payments.forEach(p => { p.date = normDate(p.date); p.ym = p.date ? p.date.slice(0,7) : ''; p.amt = +p.amt || 0; });
  D.expenses.forEach(e => {
    e.date = normDate(e.date); e.ym = e.date ? e.date.slice(0,7) : '';
    e.paidYM = e.paid ? toYM(e.paid) : ''; e.amt = +e.amt || 0;
  });
  D.timesheets.forEach(t => { t.month = toYM(t.month); t.hours = +t.hours || 0; t.rate = +t.rate || 0; });
  D.classes = D.classes || [];
  return D;
}

// CSV parsing and mapping
function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur.length || row.length){ row.push(cur); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim().toLowerCase().replace(/\s+/g,'_'));
  return rows.filter(r => r.some(x => x.trim() !== ''))
             .map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
}
function mapRows(kind, rows){
  const n = v => { const x = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g,'')); return isFinite(x) ? x : 0; };
  const yn = v => /^y/i.test(String(v || ''));
  switch (kind){
    case 'students': return rows.map(r => ({ id: r.student_id, name: r.name, classId: r.class_id, start: r.start_month,
      end: r.end_month, fee: n(r.fee) || CFG.monthlyFee, returning: yn(r.returning), reason: r.leave_reason }));
    case 'payments': return rows.map(r => ({ date: r.payment_date, sid: r.student_id, amt: n(r.amount_inc_gst) }));
    case 'expenses': return rows.map(r => ({ date: r.date, type: (r.type || 'opex').toLowerCase(), cat: r.category || 'Uncategorised',
      payee: r.payee, desc: r.description, amt: n(r.amount_ex_gst), gst: yn(r.gst_claimable), paid: r.paid_date, receipt: yn(r.receipt_attached) }));
    case 'timesheets': return rows.map(r => ({ month: r.month, teacher: r.teacher, classId: r.class_id, hours: n(r.hours), rate: n(r.hourly_rate) || CFG.teacherRate }));
    case 'classes': return rows.map(r => ({ id: r.class_id, name: r.name, teacher: r.teacher, day: r.day, time: r.start_time, seats: n(r.seats) || CFG.seats }));
  }
  return [];
}

// ---------- Model: every statement is derived from the transaction tables -
let D = null, M = null, GS = { g: CFG.growth };

function buildModel(D){
  const C = CFG, g = C.gstRate;
  const dates = [];
  D.students.forEach(s => { if (ok(s.start)) dates.push(s.start); if (ok(s.end)) dates.push(s.end); });
  D.payments.forEach(p => { if (ok(p.ym)) dates.push(p.ym); });
  D.expenses.forEach(e => { if (ok(e.ym)) dates.push(e.ym); if (ok(e.paidYM)) dates.push(e.paidYM); });
  D.timesheets.forEach(t => { if (ok(t.month)) dates.push(t.month); });
  if (!dates.length) return null;
  dates.sort();
  const months = monthRange(dates[0], dates[dates.length - 1]);
  const N = months.length, idx = {};
  months.forEach((m, i) => idx[m] = i);
  const rows = months.map((m, i) => ({ m, i, newN: 0, retN: 0, leftN: 0, active: 0, opening: 0,
    invEx: 0, invGst: 0, invInc: 0, receipts: 0, opex: {}, opexTotal: 0, capexEx: 0,
    expInc: 0, paidInc: 0, paidCapexInc: 0, payGross: 0, teachGross: 0, teachHours: 0,
    classesOpen: 0, superAmt: 0, payg: 0, wagesNet: 0, dep: 0, gstCred: 0, gstSettle: 0, gstPayable: 0,
    profit: 0, netCash: 0, cash: 0, ar: 0, unearned: 0, fa: 0, ap: 0, equity: 0, check: 0 }));

  // Students: enrolments, leavers, active roll and invoices
  const invBy = {};
  D.students.forEach(s => {
    if (!ok(s.start) || idx[s.start] === undefined) return;
    const si = idx[s.start];
    rows[si].newN++; if (s.returning) rows[si].retN++;
    if (ok(s.end) && idx[s.end] !== undefined) rows[idx[s.end]].leftN++;
    for (let i = si; i < N; i++){
      const m = months[i];
      if (ok(s.end) && m >= s.end) break;
      rows[i].active++; rows[i].invEx += s.fee;
      (invBy[s.id] = invBy[s.id] || []).push({ m, inc: s.fee * (1 + (C.feesGST ? g : 0)) });
    }
  });
  rows.forEach((r, i) => {
    r.opening = i ? rows[i-1].active : 0;
    r.invGst = C.feesGST ? r.invEx * g : 0;
    r.invInc = r.invEx + r.invGst;
  });

  // Payments (cash receipts)
  const payBy = {};
  D.payments.forEach(p => {
    if (idx[p.ym] === undefined) return;
    rows[idx[p.ym]].receipts += p.amt;
    if (p.sid) payBy[p.sid] = (payBy[p.sid] || 0) + p.amt;
  });

  // Expenses (accrual on expense month, cash on paid month)
  D.expenses.forEach(e => {
    const i = idx[e.ym]; if (i === undefined) return;
    const r = rows[i];
    if (e.type === 'payroll'){ r.payGross += e.amt; return; }
    const cred = e.gst ? e.amt * C.gstRate : 0;
    const inc = e.amt + cred;
    r.gstCred += cred;
    r.expInc += inc;
    if (e.type === 'capex') r.capexEx += e.amt;
    else { r.opex[e.cat] = (r.opex[e.cat] || 0) + e.amt; r.opexTotal += e.amt; }
    if (idx[e.paidYM] !== undefined){
      const pr = rows[idx[e.paidYM]];
      if (e.type === 'capex') pr.paidCapexInc += inc; else pr.paidInc += inc;
    }
  });

  // Timesheets (teacher hour-based pay) and teacher-month summary
  const TM = {};
  D.timesheets.forEach(t => {
    const i = idx[t.month]; if (i === undefined) return;
    const gross = t.hours * t.rate;
    rows[i].teachGross += gross; rows[i].teachHours += t.hours;
    const key = t.month + '|' + t.teacher;
    const x = TM[key] || (TM[key] = { m: t.month, name: t.teacher || '(unnamed)', hours: 0, gross: 0, classes: new Set() });
    x.hours += t.hours; x.gross += gross; x.classes.add(t.classId);
  });

  rows.forEach(r => {
    const set = new Set();
    D.students.forEach(s => { if (isActive(s, r.m)) set.add(s.classId); });
    r.classesOpen = set.size;
  });

  // Depreciation, GST, cash, balance sheet
  let cumCapex = 0, accDep = 0, gstBal = 0, cash = C.openingCash;
  const cum = { inv: 0, rec: 0, expInc: 0, paid: 0, np: 0 };
  rows.forEach((r, i) => {
    const cost = C.openingEquip + cumCapex;
    r.dep = Math.max(0, Math.min(cost / C.equipLife, cost - accDep));
    cumCapex += r.capexEx; accDep += r.dep;
    r.superAmt = (r.payGross + r.teachGross) * C.superRate;
    r.payg = (r.payGross + r.teachGross) * C.paygRate;
    r.wagesNet = r.payGross + r.teachGross - r.payg;
    r.profit = r.invEx - r.opexTotal - r.payGross - r.teachGross - r.superAmt - r.dep;
    r.gstSettle = (i > 0 && [3,6,9,12].includes(+rows[i-1].m.slice(5))) ? gstBal : 0;
    gstBal = gstBal - r.gstSettle + r.invGst - r.gstCred;
    r.gstPayable = gstBal;
    r.netCash = r.receipts - r.paidInc - r.paidCapexInc - r.wagesNet - r.payg - r.superAmt - r.gstSettle;
    cash += r.netCash; r.cash = cash;
    cum.inv += r.invInc; cum.rec += r.receipts; cum.expInc += r.expInc;
    cum.paid += r.paidInc + r.paidCapexInc; cum.np += r.profit;
    const arNet = cum.inv - cum.rec;
    r.ar = Math.max(0, arNet); r.unearned = Math.max(0, -arNet);
    r.fa = C.openingEquip + cumCapex - accDep;
    r.ap = cum.expInc - cum.paid;
    r.equity = C.openingCash + C.openingEquip + cum.np;
    r.check = (r.cash + r.ar + r.fa) - (r.ap + r.gstPayable + r.unearned + r.equity);
  });

  // Fees: invoices, FIFO allocation of payments, AR aging
  const outstanding = [], balance = {};
  Object.keys(invBy).forEach(sid => {
    let pay = payBy[sid] || 0;
    invBy[sid].forEach(v => {
      const alloc = Math.min(v.inc, pay); pay -= alloc;
      const bal = v.inc - alloc;
      if (bal > 0.005){
        const age = N - 1 - idx[v.m];
        outstanding.push({ sid, m: v.m, bal: r2(bal), age });
        balance[sid] = (balance[sid] || 0) + bal;
      }
    });
  });
  const aging = [['0–30 days',0,0],['31–60 days',0,0],['61–90 days',0,0],['Over 90 days',0,0]];
  outstanding.forEach(o => { const b = Math.min(3, o.age); aging[b][1]++; aging[b][2] += o.bal; });
  const aged60 = outstanding.filter(o => o.age >= 2);

  // Classes
  const lastM = months[N-1];
  const classMap = {};
  (D.classes || []).forEach(c => classMap[c.id] = { ...c });
  D.students.forEach(s => { if (s.classId && !classMap[s.classId]) classMap[s.classId] = { id: s.classId, name: '(not in class list)', teacher: '', day: '', time: '', seats: C.seats }; });
  const enrolledNow = {};
  D.students.forEach(s => { if (isActive(s, lastM)) enrolledNow[s.classId] = (enrolledNow[s.classId] || 0) + 1; });
  const classes = Object.values(classMap).map(c => {
    const en = enrolledNow[c.id] || 0, seats = c.seats || C.seats;
    return { ...c, seats, enrolled: en, util: seats ? en / seats : 0, over: en > seats };
  }).filter(c => c.enrolled > 0 || (D.classes || []).some(x => x.id === c.id))
    .sort((a, b) => a.id.localeCompare(b.id));

  // Quarters (BAS)
  const qs = {};
  rows.forEach(r => {
    const q = qInfo(r.m);
    const x = qs[q.key] || (qs[q.key] = { ...q, months: 0, g1: 0, g1a: 0, g11: 0, g10: 0, g1b: 0, w1: 0, w2: 0 });
    x.months++; x.g1 += r.invInc; x.g1a += r.invGst; x.g11 += r.opexTotal; x.g10 += r.capexEx;
    x.g1b += r.gstCred; x.w1 += r.payGross + r.teachGross; x.w2 += r.payg;
  });
  const quarters = Object.values(qs);
  const asOf = monthEnd(lastM);
  let nextBAS = null;
  { let cur = qInfo(lastM);
    for (let k = 0; k < 6 && !nextBAS; k++){
      if (cur.dueISO >= asOf) nextBAS = cur; else cur = qInfo(addMonth(cur.endYM, 1));
    } }
  const fyLast = qInfo(lastM).fy;
  const ytdProfit = rows.filter(r => qInfo(r.m).fy === fyLast).reduce((a, r) => a + r.profit, 0);

  const openTot = sum(rows, 'opening');
  const leaveRate = openTot ? sum(rows, 'leftN') / openTot : 0.03;
  const L = rows[N-1];

  const model = {
    months, N, rows, classes, TM, quarters, nextBAS, ytdProfit, ytdTaxProfit: fyLast, asOf, leaveRate,
    outstanding, balance, aging, aged60N: aged60.length, aged60Amt: aged60.reduce((a, o) => a + o.bal, 0),
    overbooked: classes.filter(c => c.over).length,
    noReceipts: D.expenses.filter(e => !e.receipt).length,
    apTotal: L.ap,
    checkFail: rows.some(r => Math.abs(r.check) > 1),
    growthLast: rows.length > 1 && rows[N-2].newN ? L.newN / rows[N-2].newN - 1 : NaN,
    teachersLast: Object.values(TM).filter(x => x.m === lastM).length
  };
  model.quality = quality(D);
  return model;
}

function quality(D){
  const out = [];
  const add = (sev, msg, n) => { if (n > 0) out.push({ sev, msg, n }); };
  const ids = {}; let dup = 0;
  D.students.forEach(s => { if (ids[s.id]) dup++; ids[s.id] = 1; });
  add('bad', 'Duplicate student IDs', dup);
  add('bad', 'Students with no valid start month', D.students.filter(s => !ok(s.start)).length);
  add('warn', 'Students with no class assigned', D.students.filter(s => !s.classId).length);
  add('warn', 'Payments that do not match a student ID', D.payments.filter(p => !ids[p.sid]).length);
  add('bad', 'Payments with invalid date or amount', D.payments.filter(p => !p.ym || !(p.amt > 0)).length);
  add('bad', 'Expenses with invalid date or amount', D.expenses.filter(e => !e.ym || !(e.amt > 0)).length);
  add('warn', 'Expenses with no category', D.expenses.filter(e => !e.cat || e.cat === 'Uncategorised').length);
  add('warn', 'Expenses with an unknown type (use opex, capex or payroll)', D.expenses.filter(e => !['opex','capex','payroll'].includes(e.type)).length);
  add('warn', 'Expenses with no receipt attached', D.expenses.filter(e => !e.receipt).length);
  add('bad', 'Timesheet lines with invalid month or hours', D.timesheets.filter(t => !t.month || !(t.hours > 0)).length);
  add('warn', 'Payroll lines without a payee', D.expenses.filter(e => e.type === 'payroll' && !e.payee).length);
  return out;
}

// Forward projection at a given monthly growth rate in new enrolments
function projectScenario(g, steps = 6){
  const C = CFG, R = M.rows, L = R[R.length - 1];
  let newN = L.newN, demand = L.active, classes = L.classesOpen, cash = L.cash, m = L.m, prevEnrolled = L.active;
  const otherBase = L.opexTotal, adminBase = L.payGross * (1 + C.superRate);
  const out = [];
  for (let k = 1; k <= steps; k++){
    m = addMonth(m, 1);
    newN = Math.round(newN * (1 + g));
    const leavers = Math.round(demand * M.leaveRate);
    demand = demand + newN - leavers;
    const need = Math.ceil(demand / C.seats);
    classes = Math.max(0, Math.min(need, classes + C.classesPerMonth));
    const seats = classes * C.seats;
    const enrolled = Math.min(demand, seats);
    const waitlist = demand - enrolled;
    const teacherCost = classes * C.classHours * C.teacherRate * (1 + C.superRate);
    // Admin staff and per-student marketing/supplies follow SEATED students, not the unseated waitlist
    const admin = Math.max(adminBase, Math.ceil(enrolled / C.studentsPerAdmin) * C.adminSalary * (1 + C.superRate));
    const other = otherBase + C.varPerNew * Math.max(0, enrolled - prevEnrolled);
    prevEnrolled = enrolled;
    const revenue = enrolled * C.monthlyFee;
    const net = revenue - teacherCost - admin - other;
    cash += net;
    out.push({ m, newN, leavers, demand, classes, seats, enrolled, waitlist, teachers: Math.ceil(classes / 2),
                teacherCost, admin, other, revenue, net, cash });
  }
  return out;
}

// ---------- UI helpers ------------------------------------------------------
const kpi = (l, v, d = '', cls = '') => `<div class="card kpi ${cls}"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
const pill = (t, cls) => `<span class="pill ${cls}">${t}</span>`;
function table(cols, rows, num = []){
  const isN = i => num.includes(i);
  return `<div class="table-wrap"><table><thead><tr>${cols.map((c, i) => `<th class="${isN(i) ? 'n' : ''}">${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr class="${r.tot ? 'tot' : ''}">${r.map((c, i) => `<td class="${isN(i) ? 'n' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const numCols = n => Array.from({ length: n }, (_, i) => i + 1);
function bars(items, fmt){
  const max = Math.max(1, ...items.map(i => Math.abs(i.value)));
  return `<div class="bars">${items.map(i => `<div class="bar"><b>${fmt(i.value)}</b><i style="height:${Math.max(2, Math.abs(i.value) / max * 100)}%"></i><span>${esc(i.label)}</span></div>`).join('')}</div>`;
}
const row = (label, get, R, mode = 'sum') => {
  const vals = R.map(get);
  const tot = mode === 'sum' ? vals.reduce((a, b) => a + b, 0) : mode === 'last' ? vals[vals.length - 1] : null;
  const f = v => Math.abs(v) < 0.5 ? '–' : money(v);
  const arr = [label, ...vals.map(f), tot === null ? '' : f(tot)];
  return arr;
};

// ---------- Views ------------------------------------------------------------
function vOverview(){
  const R = M.rows, L = R[R.length - 1], P = R[R.length - 2] || { active: 0, newN: 0 };
  const ytdRev = sum(R, 'invEx'), ytdNP = sum(R, 'profit');
  const kp = [
    kpi('Active students', whole(L.active), `${L.active - P.active >= 0 ? '+' : ''}${whole(L.active - P.active)} vs prior month`),
    kpi('New enrolments', whole(L.newN), `${isFinite(M.growthLast) ? pct(M.growthLast) : '–'} month on month`, M.growthLast > 1 ? 'warn' : ''),
    kpi('Tuition revenue (ex GST)', money(L.invEx), `YTD ${money(ytdRev)}`),
    kpi('Net profit before tax', money(L.profit), `YTD ${money(ytdNP)}`, L.profit < 0 ? 'bad' : 'ok'),
    kpi('Cash at period end', money(L.cash), `Alert below ${money(CFG.cashAlert)}`, L.cash < CFG.cashAlert ? 'bad' : 'ok'),
    kpi('Fees owing (receivables)', money(L.ar), `${whole(M.aged60N)} invoices 60+ days old`, M.aged60N ? 'warn' : 'ok'),
    kpi('GST payable (current)', money(L.gstPayable), M.nextBAS ? `Next BAS due ${fdate(M.nextBAS.dueISO)}` : ''),
    kpi('Classes over capacity', whole(M.overbooked), `${whole(L.classesOpen)} classes open`, M.overbooked ? 'bad' : 'ok')
  ].join('');
  const A = alertsList();
  return `
    <div class="grid kpis">${kp}</div>
    <h2>Alerts &amp; automated actions</h2>
    ${A.length ? A.map(a => `<div class="alert ${a.sev}"><b>${esc(a.t)}</b><span>${esc(a.d)}</span></div>`).join('') : '<div class="card">No alerts.</div>'}
    <div class="grid two" style="margin-top:14px">
      <div class="card"><h3>New enrolments per month</h3>${bars(R.map(r => ({ label: mLabel(r.m), value: r.newN })), whole)}</div>
      <div class="card"><h3>Revenue per month (ex GST)</h3>${bars(R.map(r => ({ label: mLabel(r.m), value: r.invEx })), money)}</div>
      <div class="card"><h3>Cash balance at month end</h3>${bars(R.map(r => ({ label: mLabel(r.m), value: r.cash })), money)}</div>
      <div class="card"><h3>Waitlist if growth continues (${Math.round(CFG.growth * 100)}% a month)</h3>
        ${bars(M.proj.map(p => ({ label: mLabel(p.m), value: p.waitlist })), whole)}
        <p class="note">Students who cannot be seated because classes cannot open fast enough.</p></div>
    </div>`;
}

function alertsList(){
  const A = [], R = M.rows, L = R[R.length - 1];
  const add = (sev, t, d) => A.push({ sev, t, d });
  if (M.overbooked) add('bad', `${M.overbooked} class(es) over capacity`, 'Move students to a class with space or open a new class before the next intake.');
  const firstWait = M.proj.find(p => p.waitlist > 0);
  if (firstWait) add('bad', `Waitlist expected from ${mLabel(firstWait.m)}`, `${whole(firstWait.waitlist)} students cannot be seated by then at ${Math.round(CFG.growth * 100)}% monthly growth. Open classes and hire teachers now.`);
  const minCash = Math.min(...M.proj.map(p => p.cash));
  if (minCash < CFG.cashAlert) add('bad', 'Projected cash below alert level', `Lowest projected cash is ${money(minCash)} against an alert of ${money(CFG.cashAlert)}.`);
  if (L.cash < CFG.cashAlert) add('bad', 'Cash below alert level', `Cash is ${money(L.cash)}.`);
  if (M.checkFail) add('bad', 'Balance sheet does not balance', 'Check the 3-statement pack for the month marked with a non-zero check.');
  if (M.aged60N) add('warn', `${whole(M.aged60N)} fee invoices are 60+ days old`, `${money(M.aged60Amt)} to chase. See Fees & payments for the reminder queue.`);
  if (M.quality.length) add('warn', `${M.quality.length} data-quality check(s) failing`, 'Fix in your source file and re-import. See Data & settings.');
  if (M.noReceipts) add('warn', `${whole(M.noReceipts)} expense(s) without a receipt`, 'Ask the payee for a receipt before the BAS is lodged (GST credits need tax invoices).');
  if (M.apTotal > 0) add('info', `Unpaid bills ${money(M.apTotal)}`, 'Listed in Admin & staff for approval and payment.');
  if (M.nextBAS) add('info', `Next BAS due ${fdate(M.nextBAS.dueISO)}`, 'Automated reminders at 30, 14 and 7 days. Send the worksheet to your tax agent 14 days before.');
  if (isFinite(M.growthLast) && M.growthLast > 1) add('warn', 'Enrolment growth above 100% a month', 'Growth at this pace outruns classes, teachers and cash. Use the Growth & risk scenarios to plan the next 6 months.');
  if (CFG.feesGST) add('info', 'Confirm GST treatment of tuition fees', 'The model charges 10% GST on fees. Some accredited education is GST-free, so confirm with your accountant.');
  return A;
}

function vStudents(){
  const R = M.rows, L = R[R.length - 1], P = R[R.length - 2] || { active: 0 };
  const growths = R.slice(1).map((r, i) => R[i].newN ? r.newN / R[i].newN - 1 : NaN).filter(isFinite);
  const reasons = {};
  D.students.forEach(s => { if (s.end) { const k = s.reason || 'Not given'; reasons[k] = (reasons[k] || 0) + 1; } });
  const reasonRows = Object.entries(reasons).sort((a, b) => b[1] - a[1]).map(([k, v]) => [esc(k), whole(v)]);
  return `
    <div class="grid kpis">
      ${kpi('Active students', whole(L.active), `${mLabel(L.m)}`)}
      ${kpi('New enrolments', whole(L.newN), `${whole(L.retN)} returning`)}
      ${kpi('Leaving forms', whole(L.leftN), `Avg leave rate ${pct(M.leaveRate)} / month`, M.leaveRate > 0.05 ? 'warn' : 'ok')}
      ${kpi('Retention (avg)', pct(1 - M.leaveRate), 'Students who stay each month')}
      ${kpi('Enrolment growth MoM', isFinite(M.growthLast) ? pct(M.growthLast) : '–', growths.length ? `Average ${pct(growths.reduce((a,b)=>a+b,0)/growths.length)}` : '')}
    </div>
    <h2>Monthly student movement</h2>
    ${table(['Month','Opening','New enrolments','Returning','Leaving forms','Closing','New MoM %','Leave rate'],
      R.map(r => [mLabel(r.m), whole(r.opening), whole(r.newN), whole(r.retN), whole(r.leftN), whole(r.active),
        R[r.i-1] && R[r.i-1].newN ? pct(r.newN / R[r.i-1].newN - 1) : '–', r.opening ? pct(r.leftN / r.opening) : '–']), numCols(7))}
    <div class="grid two" style="margin-top:14px">
      <div class="card"><h3>New enrolments by month</h3>${bars(R.map(r => ({ label: mLabel(r.m), value: r.newN })), whole)}</div>
      <div class="card"><h3>Leaving forms by reason</h3>
        ${reasonRows.length ? table(['Reason','Students'], reasonRows, [1]) : '<p class="note">No leaving forms recorded.</p>'}</div>
    </div>
    <h2>Student register</h2>
    <div class="ctrl"><label>Search by ID, name or class<input type="search" id="regq" oninput="regFilter(this.value)" placeholder="e.g. AC-00042 or CL-07"></label></div>
    <div id="regbody">${regRows('')}</div>`;
}
function regRows(q){
  q = (q || '').toLowerCase();
  const list = D.students.filter(s => !q || (s.id + ' ' + s.name + ' ' + s.classId).toLowerCase().includes(q));
  const rows = list.slice(0, 200).map(s => [esc(s.id), esc(s.name), esc(s.classId), mLabel(s.start), s.end ? mLabel(s.end) : '–',
    s.end ? pill('Left', 'warn') : pill('Active', 'ok'), money(s.fee), money(M.balance[s.id] || 0)]);
  return table(['Student ID','Name','Class','Start','Left','Status','Fee / month','Balance owing'], rows, [6, 7]) +
    (list.length > 200 ? `<p class="note">Showing 200 of ${whole(list.length)}. Refine the search to see others.</p>` : '');
}
function regFilter(q){ document.getElementById('regbody').innerHTML = regRows(q); }

function vFees(){
  const R = M.rows, L = R[R.length - 1];
  const invYTD = sum(R, 'invInc'), recYTD = sum(R, 'receipts');
  const kp = [
    kpi('Invoiced YTD (incl GST)', money(invYTD), `${whole(sum(R, 'active'))} student-months billed`),
    kpi('Collected YTD', money(recYTD), `${money(recYTD - invYTD)} vs invoiced`),
    kpi('Collection rate', pct(recYTD / invYTD), 'Receipts ÷ invoices', recYTD / invYTD < 0.9 ? 'warn' : 'ok'),
    kpi('Fees owing (ledger)', money(L.ar), `Prepaid fees ${money(L.unearned)}`),
    kpi('Owing 60+ days', money(M.aged60Amt), `${whole(M.aged60N)} invoices`, M.aged60N ? 'warn' : 'ok'),
    kpi('Students in arrears', whole(Object.keys(M.balance).length), 'Students with a balance')
  ].join('');
  const byS = {};
  M.outstanding.forEach(o => {
    const x = byS[o.sid] || (byS[o.sid] = { sid: o.sid, bal: 0, age: 0, oldest: o.m });
    x.bal += o.bal; if (o.age > x.age){ x.age = o.age; x.oldest = o.m; }
  });
  const queue = Object.values(byS).sort((a, b) => b.age - a.age || b.bal - a.bal).slice(0, 100).map(x => {
    const action = x.age >= 3 ? pill('Final notice · collections', 'bad') : x.age === 2 ? pill('Reminder 2 + call · hold next term', 'warn')
                 : x.age === 1 ? pill('Reminder 1 · email + SMS', 'info') : pill('Monitor', 'ok');
    const cls = D.students.find(s => s.id === x.sid);
    return [esc(x.sid), esc(cls ? cls.classId : ''), money(x.bal), mLabel(x.oldest), x.age, action];
  });
  const agingRows = M.aging.map(([l, n, a]) => [l, whole(n), money(a), M.outstanding.length ? pct(a / Math.max(1, sum(M.aging.map(x => ({ v: x[2] })), 'v'))) : '–']);
  const reconDiff = M.outstanding.reduce((a, o) => a + o.bal, 0) - L.ar;
  return `
    <div class="grid kpis">${kp}</div>
    <h2>Monthly billing and collection</h2>
    ${table(['Month','Students billed','Invoiced ex GST','GST','Invoiced incl GST','Receipts','Collected %','Fees owing (month end)','Prepaid fees'],
      R.map(r => [mLabel(r.m), whole(r.active), money(r.invEx), money(r.invGst), money(r.invInc), money(r.receipts),
        r.invInc ? pct(r.receipts / r.invInc) : '–', money(r.ar), money(r.unearned)]), numCols(8))}
    <div class="grid two" style="margin-top:14px">
      <div class="card"><h3>Receivables aging (by invoice)</h3>
        ${table(['Age','Invoices','Amount','Share'], agingRows, [1,2,3])}
        <p class="note">Payments are applied to the oldest invoice first. Reconciliation difference to the ledger: ${money(reconDiff)}${Math.abs(reconDiff) < 1 ? ' ' + pill('matches', 'ok') : ' ' + pill('check', 'warn')}</p>
      </div>
      <div class="card"><h3>Automated reminder rules</h3>
        <ul class="note" style="font-size:13px;color:var(--ink);margin:0 0 0 18px">
          <li>Invoice issued on the 1st of each month (or term start).</li>
          <li>Reminder 1 at 30 days, email + SMS.</li>
          <li>Reminder 2 at 60 days with a phone call; hold next term enrolment.</li>
          <li>Final notice at 90 days; refer to collections or stop access.</li>
          <li>Encourage card-on-file or direct debit to cut arrears.</li>
        </ul></div>
    </div>
    <h2>Reminder queue (oldest first)</h2>
    ${queue.length ? table(['Student ID','Class','Balance owing','Oldest unpaid invoice','Months overdue','Next action'], queue, [2,4]) : '<div class="card">No outstanding fees. Nothing to chase.</div>'}`;
}

function vAdmin(){

    ...cats.map(catRow),

    ['Teaching wages (gross)', ...R.map(r => money(r.teachGross)), money(sum(R,'teachGross'))],
    ['Admin salaries (gross)', ...R.map(r => money(r.payGross)), money(sum(R,'payGross'))],
    ['Superannuation', ...R.map(r => money(r.superAmt)), money(sum(R,'superAmt'))],
    ['Total cash spend (ex GST)', ...R.map(r => money(r.opexTotal + r.teachGross + r.payGross + r.superAmt + r.capexEx)),
      money(sum(R,'opexTotal') + sum(R,'teachGross') + sum(R,'payGross') + sum(R,'superAmt') + sum(R,'capexEx'))]
  ];
  matrix[matrix.length - 1].tot = true;
  const unpaid = D.expenses.filter(e => e.type !== 'payroll' && e.ym && !e.paidYM).sort((a, b) => a.date.localeCompare(b.date));
  const unpaidRows = unpaid.slice(0, 50).map(e => {
    const age = Math.max(0, Math.round((Date.parse(monthEnd(lastM)) - Date.parse(e.date)) / 864e5));
    return [fdate(e.date), esc(e.payee), esc(e.cat), money(e.amt * (1 + (e.gst ? CFG.gstRate : 0))), `${age} days`, e.receipt ? pill('Receipt', 'ok') : pill('No receipt', 'warn')];
  });
  const teachers = Object.values(M.TM).filter(x => x.m === lastM).sort((a, b) => a.name.localeCompare(b.name));
  const teacherYTD = {};
  Object.values(M.TM).forEach(x => teacherYTD[x.name] = (teacherYTD[x.name] || 0) + x.gross);
  const tRows = teachers.map(x => [esc(x.name), whole(x.classes.size), whole(x.hours), money(x.hours ? x.gross / x.hours : 0),
    money(x.gross), money(x.gross * CFG.paygRate), money(x.gross * CFG.superRate), money(x.gross * (1 - CFG.paygRate)), money(teacherYTD[x.name])]);
  const payees = {};
  D.expenses.filter(e => e.type === 'payroll').forEach(e => {
    const k = e.payee || '(no name)'; const x = payees[k] || (payees[k] = { name: k, months: new Set(), ytd: 0, last: 0 });
    x.months.add(e.ym); x.ytd += e.amt; if (e.ym === lastM) x.last += e.amt;
  });
  const aRows = Object.values(payees).map(x => [esc(x.name), whole(x.months.size), money(x.last), money(x.ytd),
    money(x.ytd * CFG.superRate), money(x.ytd * CFG.paygRate)]);
  return `
    <div class="grid kpis">
      ${kpi('Operating expenses YTD (ex GST)', money(sum(R,'opexTotal')), `${cats.length} categories`)}
      ${kpi('Wages YTD (gross)', money(sum(R,'teachGross') + sum(R,'payGross')), `Teachers ${money(sum(R,'teachGross'))} · admin ${money(sum(R,'payGross'))}`)}
      ${kpi('Superannuation YTD', money(sum(R,'superAmt')), `PAYG withheld ${money(sum(R,'payg'))}`)}
      ${kpi('Unpaid bills (ledger)', money(L.ap), `${unpaid.length} bill(s) open`, L.ap > 0 ? 'warn' : 'ok')}
      ${kpi('Headcount (latest month)', whole(M.teachersLast + Object.keys(payees).length), `${M.teachersLast} teachers · ${Object.keys(payees).length} admin`)}
      ${kpi('Missing receipts', whole(M.noReceipts), 'GST credits need tax invoices', M.noReceipts ? 'warn' : 'ok')}
    </div>
    <h2>Expense matrix by month (ex GST)</h2>
    ${table(['Category', ...R.map(r => mLabel(r.m)), 'YTD'], matrix, numCols(R.length + 1))}
    <h2>Teacher pay · ${mLabel(lastM)} (hour-based)</h2>
    ${tRows.length ? table(['Teacher','Classes','Hours','Avg rate','Gross','PAYG (est.)','Super (est.)','Net pay (est.)','YTD gross'], tRows, numCols(8))
      : '<div class="card">No timesheets for this month.</div>'}
    <h2>Admin staff payroll (all months)</h2>
    ${aRows.length ? table(['Staff member','Months paid','Gross this month','Gross YTD','Super YTD (est.)','PAYG YTD (est.)'], aRows, numCols(5)) : '<div class="card">No admin payroll entries.</div>'}
    <h2>Bills awaiting payment and approval</h2>
    ${unpaidRows.length ? table(['Bill date','Payee','Category','Amount incl GST','Age','Receipt'], unpaidRows, [3]) : '<div class="card">No unpaid bills.</div>'}`;
}

    kpi('Classes running', whole(L.classesOpen), `${M.classes.length} classes on file`),

}
function gridHTML(){
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat'];
  const times = [...new Set(M.classes.map(c => c.time).filter(Boolean))].sort();
  if (!times.length) return '<p class="note">Add day and start_time to classes.csv to see the weekly timetable.</p>';
  const head = `<th>Start</th>${days.map(d => `<th>${d}</th>`).join('')}`;
  const body = times.map(t => `<tr><td><b>${esc(t)}</b></td>${days.map(d => {
    const cs = M.classes.filter(c => c.day === d && c.time === t);
    return `<td>${cs.map(c => `<span class="pill ${c.over ? 'bad' : 'info'}" title="${esc(c.name)} · ${esc(c.teacher)}">${esc(c.id)} ${c.enrolled}/${c.seats}</span>`).join(' ')}</td>`;
  }).join('')}</tr>`).join('');
  return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function vStatements(){
  const R = M.rows;
  const cols = ['', ...R.map(r => mLabel(r.m)), 'YTD / end'];
  const L = (label, get, mode = 'sum', tot = false) => { const arr = row(label, get, R, mode); if (tot) arr.tot = true; return arr; };
  const pl = [
    L('Tuition revenue (ex GST)', r => r.invEx),
    L('Teaching wages (gross)', r => r.teachGross),
    L('Gross profit after teaching wages', r => r.invEx - r.teachGross, 'sum', true),
    L('Admin salaries (gross)', r => r.payGross),
    L('Superannuation (all staff)', r => r.superAmt),
    ...[...new Set(R.flatMap(r => Object.keys(r.opex)))]
      .sort((a, b) => sum(R.map(r => ({ v: r.opex[b] || 0 })), 'v') - sum(R.map(r => ({ v: r.opex[a] || 0 })), 'v'))
      .map(c => L(c, r => r.opex[c] || 0)),
    L('Depreciation', r => r.dep),
    L('Total operating expenses', r => r.teachGross + r.payGross + r.superAmt + r.opexTotal + r.dep, 'sum', true),
    L('Net profit before tax', r => r.profit, 'sum', true)
  ];
  const bs = [
    L('Cash at bank', r => r.cash, 'last'),
    L('Fees owing (receivables)', r => r.ar, 'last'),
    L('Equipment (net book value)', r => r.fa, 'last'),
    L('Total assets', r => r.cash + r.ar + r.fa, 'last', true),
    L('Bills owing (accounts payable)', r => r.ap, 'last'),
    L('GST payable to ATO', r => r.gstPayable, 'last'),
    L('Fees received in advance', r => r.unearned, 'last'),
    L('Total liabilities', r => r.ap + r.gstPayable + r.unearned, 'last', true),
    L("Owner's equity (opening + retained profit)", r => r.equity, 'last'),
    L('Total liabilities & equity', r => r.ap + r.gstPayable + r.unearned + r.equity, 'last', true),
    L('Balance check (should be zero)', r => r.check, 'last')
  ];
  const cf = [
    L('Fees received from students', r => r.receipts),
    L('Suppliers & bills paid', r => -r.paidInc),
    L('Wages paid (net of PAYG)', r => -r.wagesNet),
    L('PAYG withholding remitted', r => -r.payg),
    L('Superannuation paid', r => -r.superAmt),
    L('GST paid / (refunded) to ATO', r => -r.gstSettle),
    L('Net cash from operations', r => r.receipts - r.paidInc - r.wagesNet - r.payg - r.superAmt - r.gstSettle, 'sum', true),
    L('Equipment purchased (paid)', r => -r.paidCapexInc),
    L('Net change in cash', r => r.netCash, 'sum', true),
    L('Opening cash', r => r.i ? R[r.i-1].cash : CFG.openingCash, 'first'),
    L('Closing cash', r => r.cash, 'last', true)
  ];
  // patch first-mode for opening cash: show opening of first month
  cf[9] = ['Opening cash', ...R.map((r, i) => money(i ? R[i-1].cash : CFG.openingCash)), money(R[0] ? (R[0].cash - R[0].netCash) : 0)];
  cf[9][cf[9].length - 1] = money(R[0].cash - R[0].netCash);
  const check = R.every(r => Math.abs(r.check) < 1);
  const sec = (t, rows) => `<h2>${t}</h2>${table(cols, rows, numCols(R.length + 1))}`;
  return `
    <p class="note">Monthly management accounts built from the transaction data. Accrual P&amp;L and balance sheet, direct-method cash flow. ${check ? pill('Balance sheet balances every month', 'ok') : pill('Balance sheet out of balance: see check row', 'bad')}</p>
    ${sec('Profit &amp; loss statement', pl)}
    ${sec('Balance sheet (month end)', bs)}
    ${sec('Cash flow statement', cf)}
    <p class="note" style="margin-top:10px">Assumptions: wages PAYG and super are paid in the month; BAS is settled the month after each quarter ends; equipment is depreciated straight line from the month after purchase; income tax is shown on the BAS &amp; tax page, not in these statements.</p>`;
}

function vGrowth(){
  const g = GS.g;
  const P = projectScenario(g);
  const scen = [0.5, 1, 2].map(x => {
    const p = projectScenario(x), last = p[p.length - 1];
    return [`${Math.round(x * 100)}% a month`, whole(last.demand), whole(last.enrolled), `<b>${whole(last.waitlist)}</b>`,
      whole(last.classes), whole(last.teachers), money(last.cash),
      (p.find(q => q.waitlist > 0) || {}).m ? mLabel(p.find(q => q.waitlist > 0).m) : 'None',
      (p.find(q => q.cash < CFG.cashAlert) || {}).m ? mLabel(p.find(q => q.cash < CFG.cashAlert).m) : 'None'];
  });
  const L = M.rows[M.rows.length - 1];
  const fp = P[P.length - 1];
  const threats = [
    ['Capacity runs out (waitlist)', fp.waitlist > 0 ? pill(`${whole(fp.waitlist)} waitlisted`, 'bad') : pill('Under control', 'ok'),
      'Demand grows faster than classes', 'Open a class when any class reaches 90%; take deposits to hold seats; run a waitlist with a 2-week response rule'],

      'Hiring lags enrolments', 'Casual teacher pool; cap teaching hours at 100 a month each; cross-train by subject; approved timesheets only'],
    ['Cash squeezed by hiring ahead of fees', fp.cash < CFG.cashAlert ? pill('Cash alert', 'bad') : pill('Cash OK', 'ok'),
      'Costs rise before fees are collected', 'Collect term fees in advance; staged hiring with cash gates; agree an overdraft or line of credit now'],
    ['Fee arrears', M.aged60N ? pill(money(M.aged60Amt) + ' over 60 days', 'warn') : pill('None over 60 days', 'ok'),
      'Late or missed payments', 'Card on file or direct debit; automatic reminders at 30/60/90 days; hold enrolment for overdue fees'],
    ['PAYG and super errors on hourly pay', M.rows.some(r => r.teachHours > 0) ? pill('Monitor', 'info') : pill('No data', 'warn'),
      'Manual timesheets and calculations', 'Approve timesheets before each pay run; payroll software with STP reporting; two-person check on pay runs'],
    ['BAS / GST late or wrong', M.nextBAS ? pill(`Due ${fdate(M.nextBAS.dueISO)}`, 'info') : pill('No due date', 'warn'),
      'Missing receipts; unclear fee GST status', 'Receipt for every bill; confirm GST treatment of fees; monthly reconciliation; agent review 14 days before due'],
    ['Data in messy spreadsheets', M.quality.length ? pill(`${M.quality.length} checks failing`, 'warn') : pill('Clean', 'ok'),
      'Duplicate IDs, typos, no single source', 'One student record per ID with validation; import CSV here; back up weekly; restrict edit access'],
    ['Key-person dependency', pill('Standing risk', 'warn'), 'One person knows the spreadsheets', 'Written procedures for each section of this dashboard; a second trained person; monthly close checklist'],
    ['Student leaving spike', M.leaveRate > 0.05 ? pill(`${pct(M.leaveRate)} / month`, 'warn') : pill(`${pct(M.leaveRate)} / month`, 'ok'),
      'Quality or schedule problems', 'Exit survey on every leaving form; early-warning attendance check; reason tracking (see Students)'],
    ['Staff load per admin', pill(`${whole(L.active / Math.max(1, Math.ceil(L.active / CFG.studentsPerAdmin)))} students each`, L.active / CFG.studentsPerAdmin > CFG.studentsPerAdmin ? 'bad' : 'ok'),
      'Admin staff not keeping pace', 'Automate enrolment forms, invoices and reminders; add an admin hire when the ratio passes the target'],
    ['Compliance (child safety, international students)', pill('Check manually', 'warn'),
      'Expired clearances; visa and CRICOS obligations', 'Track working-with-children checks and student visa conditions in a register with expiry alerts']
  ];
  return `
    <div class="ctrl">
      <label>Enrolment growth per month (%)<input type="number" step="10" value="${Math.round(g * 100)}" oninput="setGrowth(this.value)" style="width:140px"></label>
      <span class="note">200 means new enrolments triple each month. Try 50 or 100 to compare.</span>
    </div>
    <div class="grid kpis">
      ${kpi('Students in 6 months', whole(fp.demand), `${whole(fp.enrolled)} seated · ${whole(fp.waitlist)} waitlisted`, fp.waitlist ? 'bad' : 'ok')}
      ${kpi('Classes needed', whole(Math.ceil(fp.demand / CFG.seats)), `${whole(fp.classes)} can open at ${CFG.classesPerMonth}/month`)}
      ${kpi('Teachers in 6 months', whole(fp.teachers), `Cost ${money(fp.teacherCost)} a month`)}
      ${kpi('Cash in 6 months', money(fp.cash), `Alert below ${money(CFG.cashAlert)}`, fp.cash < CFG.cashAlert ? 'bad' : 'ok')}
    </div>
    <h2>Projection from ${mLabel(L.m)} at ${Math.round(g * 100)}% monthly growth</h2>
    ${table(['Month','New enquiries','Leavers','Students','Classes','Seats','Seated','Waitlist','Teachers','Teacher cost','Admin cost','Other costs','Net cash flow','Cash'],
      P.map(p => [mLabel(p.m), whole(p.newN), whole(p.leavers), whole(p.demand), whole(p.classes), whole(p.seats), whole(p.enrolled),

    <p class="note">Projection uses your current class size, hours, rates and leaver rate. Cash excludes GST timing. Revenue counts only seated students.</p>

    ${table(['Growth','Students','Seated','Waitlist','Classes','Teachers','Cash','First waitlist','Cash below alert'], scen, [1,2,3,4,5,6])}
    <h2>Threat register &amp; mitigations</h2>
    ${table(['Threat','Status now','Cause','Mitigation & automation'], threats.map(t => [t[0], t[1], esc(t[2]), esc(t[3])]))}`;
}

  ['students', 'Students & enrolment', vStudents],
  ['fees', 'Fees & payments', vFees],
  ['admin', 'Admin & staff expenses', vAdmin],
  ['schedule', 'Classes & capacity', vSchedule],
  ['bas', 'BAS & tax', vBAS],
  ['statements', '3-statement monthly pack', vStatements],
  ['growth', 'Growth scenarios & risk', vGrowth]
];
function renderNav(){
  document.getElementById('nav').innerHTML = VIEWS.map(([id, t], i) =>
    `<a href="#${id}" data-id="${id}"><span class="no">${i + 1}</span>${t}</a>`).join('');
}
function renderAll(){
  document.getElementById('views').innerHTML = VIEWS.map(([id]) => `<section class="view" id="v-${id}"></section>`).join('');
  VIEWS.forEach(([id]) => renderView(id));
  showView();
}
function renderView(id){
  const el = document.getElementById('v-' + id);
  const fn = VIEWS.find(v => v[0] === id)[2];
  el.innerHTML = M ? fn() : '<div class="card">No data loaded. Open <b>Data &amp; settings</b> to load the sample or import your CSV files.</div>';
}
function showView(){
  const id = (location.hash || '#overview').slice(1);
  const v = VIEWS.find(x => x[0] === id) || VIEWS[0];
  VIEWS.forEach(([k]) => document.getElementById('v-' + k).classList.toggle('on', k === v[0]));
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.id === v[0]));
  document.getElementById('ptitle').textContent = v[1];
  document.getElementById('psub').textContent = M
    ? `${CFG.company} · ${mLabel(M.months[0])} to ${mLabel(M.months[M.N - 1])} · as at ${fdate(M.asOf)}`
    : CFG.company;
  window.scrollTo(0, 0);
}
function refresh(){
  M = buildModel(D);
  if (M) M.proj = projectScenario(CFG.growth);
  renderNav(); renderAll();
  if (document.getElementById('drawerHost').innerHTML) openDrawer();
}

// ---------- Data & settings drawer ---------------------------------------
function setCfg(k, el){
  const f = FIELDS.find(x => x[0] === k);
  let v = f[2] === 'bool' ? el.checked : parseFloat(el.value);
  if (typeof v === 'number'){ if (isNaN(v)) return; if (f[2] === 'pct') v = v / 100; }
  CFG[k] = v;
  GS.g = CFG.growth;
  refresh();
}
function openDrawer(){
  const fields = FIELDS.map(([k, label, t]) => t === 'bool'
    ? `<label class="chk"><input type="checkbox" ${CFG[k] ? 'checked' : ''} onchange="setCfg('${k}',this)"> ${esc(label)}</label>`
    : `<label>${esc(label)}<input type="number" step="any" value="${t === 'pct' ? Math.round(CFG[k] * 10000) / 100 : CFG[k]}" onchange="setCfg('${k}',this)"></label>`).join('');
  const q = D ? quality(D) : [];
  const counts = D ? `${whole(D.students.length)} students · ${whole(D.payments.length)} payments · ${whole(D.expenses.length)} expenses · ${whole(D.timesheets.length)} timesheet lines · ${whole(D.classes.length)} classes` : '';
  document.getElementById('drawerHost').innerHTML = `
    <div class="scrim" onclick="closeDrawer()"></div>
    <div class="drawer" role="dialog" aria-label="Data and settings">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 style="margin:0">Data &amp; settings</h2>
        <button class="btn" onclick="closeDrawer()">Close</button>
      </div>
      <section style="margin-top:14px">
        <h3>Load data</h3>
        <p class="note">Current data: ${counts || 'none'}</p>
        <div class="grid" style="gap:10px;margin-top:8px">
          <button class="btn primary" onclick="loadSample()">Load sample data (6 months, 200% growth)</button>
          <label class="note">Students CSV <input type="file" accept=".csv" onchange="importCSV('students',this)"></label>
          <label class="note">Payments CSV <input type="file" accept=".csv" onchange="importCSV('payments',this)"></label>
          <label class="note">Expenses CSV (type: opex, capex or payroll) <input type="file" accept=".csv" onchange="importCSV('expenses',this)"></label>
          <label class="note">Timesheets CSV (teacher hours) <input type="file" accept=".csv" onchange="importCSV('timesheets',this)"></label>
          <label class="note">Classes CSV (optional, for the timetable) <input type="file" accept=".csv" onchange="importCSV('classes',this)"></label>
        </div>
        <p class="note" style="margin-top:8px">Download blank templates:
          ${Object.keys(TEMPLATES).map(k => `<a href="#" onclick="downloadTemplate('${k}');return false">${k}</a>`).join(' · ')}</p>
      </section>
      <section>
        <h3>Assumptions</h3>
        <div class="fields">${fields}</div>
        <p class="note" style="margin-top:8px">Changing assumptions recalculates every statement. PAYG is a simple average: use ATO withholding tables for real payroll. GST on fees and the fee GST status must be confirmed with your accountant.</p>
      </section>
      <section>
        <h3>Data quality checks</h3>
        ${q.length ? `<ul>${q.map(x => `<li>${pill(x.sev === 'bad' ? 'Fix' : 'Review', x.sev === 'bad' ? 'bad' : 'warn')} ${esc(x.msg)}: <b>${whole(x.n)}</b></li>`).join('')}</ul>`
          : '<p class="note">All checks pass.</p>'}
      </section>
      <section>
        <h3>CSV columns</h3>
        <ul class="note" style="font-size:12px">
          <li><b>students</b>: student_id, name, class_id, start_month (YYYY-MM), end_month (leaving month, optional), fee, returning (Y/N), leave_reason</li>
          <li><b>payments</b>: payment_date, student_id, amount_inc_gst</li>
          <li><b>expenses</b>: date, type (opex/capex/payroll), category, payee, description, amount_ex_gst, gst_claimable (Y/N), paid_date (blank = unpaid), receipt_attached (Y/N)</li>
          <li><b>timesheets</b>: month, teacher, class_id, hours, hourly_rate</li>
          <li><b>classes</b>: class_id, name, teacher, day, start_time, seats</li>
        </ul>
        <p class="note">Dates accept YYYY-MM-DD or DD/MM/YYYY.</p>
      </section>
    </div>`;
}
function closeDrawer(){ document.getElementById('drawerHost').innerHTML = ''; }
function loadSample(){ D = finalise(makeSample()); refresh(); openDrawer(); }
function importCSV(kind, el){
  const f = el.files && el.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const rows = parseCSV(String(reader.result));
      D = D || { students: [], payments: [], expenses: [], timesheets: [], classes: [] };
      D[kind] = mapRows(kind, rows);
      D = finalise(D);
      refresh();
    } catch (err) { alert('Could not read ' + kind + ' file: ' + err.message); }
    openDrawer();
  };
  reader.readAsText(f);
}
function downloadTemplate(kind){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([TEMPLATES[kind] + '\n'], { type: 'text/csv' }));
  a.download = kind + '_template.csv';
  a.click();
}

// ---------- Boot -----------------------------------------------------------
document.getElementById('openData').addEventListener('click', openDrawer);
window.addEventListener('hashchange', showView);
D = finalise(makeSample());
refresh();
showView();
</script>
</body>
</html>
